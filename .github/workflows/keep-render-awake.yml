# Temporary keep-alive for the Render free web service so judges do not
# hit a 15-minute cold start. GET /health only: no writes, no LLM, no pay.
# Disable in GitHub → Actions → this workflow → Disable workflow.
name: Keep Render awake

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /health
        run: |
          curl -fsS --max-time 30 \
            "https://blinka-invoice-api.onrender.com/health"
