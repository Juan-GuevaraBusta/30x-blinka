# T4.9 — API on Render + managed Postgres (D003 SUPUESTO). No secret values in Git.
services:
  - type: web
    name: blinka-invoice-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.api.asgi:create_production_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blinka-postgres
          property: connectionString
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: CORS_ORIGINS
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: JEV_API_KEY
        sync: false

databases:
  - name: blinka-postgres
    databaseName: blinka
    plan: free
