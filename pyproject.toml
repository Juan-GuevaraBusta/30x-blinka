[project]
name = "blinka-invoice-agent"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "langgraph>=1.0",
    "langsmith>=0.14",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "hypothesis>=6.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/app", "backend/tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
